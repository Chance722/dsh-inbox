# pnpm settings live here (the `pnpm` field in package.json is no longer read).
# esbuild needs its postinstall to place the platform binary; without an explicit
# allowance pnpm blocks it and every `pnpm run` fails the dependency check.
packages:
  - .

allowBuilds:
  esbuild: set this to true or false

# pnpm's default `minimumReleaseAge` (24h) refuses a package published minutes
# ago. This repo tracks dsh's rc line on purpose, so the age gate is lifted for
# that scope only — every other dependency still has to age.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

onlyBuiltDependencies:
  - esbuild

# esbuild's build script is already allowed above; this only stops pnpm from
# re-running the dependency check before every `pnpm run` (which exits non-zero
# on the "ignored builds" notice and would break `pnpm build` / `pnpm test`).
verifyDepsBeforeRun: false
