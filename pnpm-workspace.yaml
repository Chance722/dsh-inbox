# pnpm settings live here (the `pnpm` field in package.json is no longer read).
packages:
  - .

# Dependency build scripts are gated, and the value has to be a boolean: pnpm
# hands you this key as a placeholder line ("set this to true or false"), and a
# non-boolean is silently ignored — the build stays blocked and `pnpm install`
# exits non-zero with ERR_PNPM_IGNORED_BUILDS. esbuild is the one this repo needs
# (its postinstall places the platform binary), and a bare name covers every
# version, 0.28.x included — the one vitest drags in.
allowBuilds:
  esbuild: true

# pnpm's default `minimumReleaseAge` (24h) refuses a package published minutes
# ago. This repo tracks dsh's rc line on purpose, so the age gate is lifted for
# that scope only — every other dependency still has to age.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

onlyBuiltDependencies:
  - esbuild

# esbuild's build script is already allowed above; this only stops pnpm from
# re-running the dependency check before every `pnpm run` (which exits non-zero
# on the "ignored builds" notice and would break `pnpm build` / `pnpm test`).
verifyDepsBeforeRun: false
