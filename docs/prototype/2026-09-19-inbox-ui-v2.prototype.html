<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>原型 v2 · 三栏分诊 + 卡片列表（假数据，不是产品 UI）</title>
<!--
  原型 · 一次性代码 · 不是产品的一部分。

  上一版（2026-09-19-inbox-ui.prototype.html）四个方案里，用户选了 A「三栏分诊」，
  并提了四条修改：
    1. 选定类目后的内容要改成**卡片列表**，点卡片才在右侧 dock 出详情，卡片要有高亮态；
    2. 卡片外框统一，**内容按类别不同**（文本 / 图片 / 链接 / 视频音频 / 文件 / 密钥）；
    3. 图片与视频要能**放大查看**（灯箱）；
    4. 右上角「入库设置」改成**弹窗**；顺带问能不能用开源图标库 —— 本文件用的就是
       Lucide（ISC，v1.47.0）的真实路径数据，内联在这里，所以离线也能看。

  三种卡片密度**都保留，并升级成产品里的「列表模式」开关**（工具栏右侧那三个按钮，用户随时切；
  底部浮条是原型自己的切换器，两边同步）。其余（右 dock 详情、灯箱、设置弹窗）三者共用。

  另外：横幅上有一行**动作回执**——每次点击都会在那里留一句，没回执就说明点击没到达处理函数；
  处理函数里抛异常也会直接写在同一行（红色）。点下去"没反应"是最难查的故障形态，不该让它静默。
-->
<style>
  :root {
    --bg: #151517; --l1: #232324; --l2: #2c2c2e; --l3: #353638;
    --fg: #f9fafb; --cap: #81858c; --dim: #6b6f76;
    --b1: #ffffff0f; --b2: #ffffff1f; --b3: #ffffff2e;
    --hover: #ffffff14; --active: #ffffff24;
    --accent: #6e9ef7; --warn: #e0b341; --danger: #e5695f; --ok: #5fb87a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Consolas, Menlo, "Microsoft YaHei", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #0d0d0e; color: var(--fg); font: 13px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  svg { flex: none; vertical-align: -2px; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--cap); } .tiny { font-size: 11px; }
  .grow { flex: 1; } .row { display: flex; align-items: center; gap: 8px; }

  .wrap { padding: 10px; height: 100%; }
  .frame { height: 100%; border: 1px solid var(--b2); border-radius: 12px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: linear-gradient(90deg, #2a2413, #1c1a13); border-bottom: 1px solid var(--b2); font-size: 12px; color: #e8d9a8; flex: none; }
  .banner b { color: #ffe9a8; }
  .banner .kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--b2); border-radius: 4px; }
  .shell { flex: 1; min-height: 0; display: flex; }

  /* 左侧会话栏：dsh 原样，不是候选设计 */
  .side { width: 228px; flex: none; border-right: 1px solid var(--b1); display: flex; flex-direction: column; }
  .side .row-btn { padding: 6px 10px; border-radius: 6px; text-align: left; display: flex; gap: 8px; align-items: center; }
  .side .row-btn:hover { background: var(--hover); }
  .side .row-btn.on { background: var(--active); }
  .side-h { font-size: 11px; color: var(--cap); padding: 10px 12px 4px; }
  .sess { padding: 5px 12px; border-radius: 6px; color: var(--cap); display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
  .sess.on { background: var(--hover); color: var(--fg); }
  .side-foot { margin-top: auto; padding: 9px 12px; border-top: 1px solid var(--b1); color: var(--cap); font-size: 12px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dock { width: 404px; flex: none; border-left: 1px solid var(--b1); background: var(--l1); display: flex; flex-direction: column; }
  .dock.closed { display: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--b1); flex: none; min-height: 46px; }
  .title { font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--b2); border-radius: 8px; font-size: 12px; }
  .btn:hover { background: var(--hover); }
  .btn.icon { padding: 5px 7px; }
  .btn.primary { background: var(--fg); color: #16161a; border-color: var(--fg); font-weight: 600; }
  .btn.ghost { border-color: transparent; color: var(--cap); }
  .btn.ghost:hover { color: var(--fg); background: var(--hover); }
  .btn.sm { padding: 3px 8px; font-size: 11px; border-radius: 6px; }
  input.search { flex: 1; background: var(--l1); border: 1px solid var(--b1); border-radius: 8px; padding: 6px 10px; min-width: 90px; }
  input.search::placeholder { color: var(--dim); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--b1); border-radius: 999px; color: var(--cap); font-size: 12px; }
  .chip:hover { background: var(--hover); color: var(--fg); }
  .chip.on { background: var(--active); color: var(--fg); border-color: var(--b2); }
  .seg { display: inline-flex; border: 1px solid var(--b1); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { padding: 5px 9px; color: var(--cap); display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--b1); }
  .seg button:hover { background: var(--hover); color: var(--fg); }
  .seg button.on { background: var(--active); color: var(--fg); }
  .echo { font-size: 11px; color: var(--dim); }
  .echo.bad { color: var(--danger); }

  /* 左侧类目栏 */
  .rail { width: 190px; flex: none; border-right: 1px solid var(--b1); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .rail .item { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 8px; color: var(--cap); text-align: left; }
  .rail .item:hover { background: var(--hover); color: var(--fg); }
  .rail .item.on { background: var(--active); color: var(--fg); }
  .rail .item .n { margin-left: auto; font-size: 11px; opacity: .7; }
  .rail-h { font-size: 11px; color: var(--cap); padding: 10px 9px 4px; }

  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--b1); color: var(--cap); font-size: 12px; flex: none; }
  .empty { padding: 40px 16px; text-align: center; color: var(--cap); }

  /* ---------- 卡片（三种处理方式共用同一份内容模型） ---------- */
  .card { position: relative; border: 1px solid var(--b1); background: var(--l1); border-radius: 12px; text-align: left; width: 100%; display: flex; overflow: hidden; }
  .card:hover { border-color: var(--b2); background: var(--l2); }
  .card.on { border-color: var(--accent); background: var(--l2); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.on::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .card .thumb { flex: none; background: repeating-linear-gradient(135deg, #2f3238 0 10px, #292c31 10px 20px); display: flex; align-items: center; justify-content: center; color: var(--dim); border-right: 1px solid var(--b1); }
  .card .body { padding: 10px 12px; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .card .t { font-size: 13px; color: var(--fg); display: block; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--cap); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; flex-wrap: wrap; }
  .card .kind { display: inline-flex; align-items: center; gap: 4px; }
  .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .play i { width: 30px; height: 30px; border-radius: 50%; background: #000000a8; border: 1px solid #ffffff40; display: flex; align-items: center; justify-content: center; }
  .poster { background: linear-gradient(135deg, #3a3f47, #23262b); }
  .shot { background: linear-gradient(135deg, #3d3a33, #26241f); }
  .masked { font-family: var(--mono); letter-spacing: .5px; background: var(--l3); border-radius: 6px; padding: 5px 8px; color: var(--cap); }
  .v1list { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .v1 .thumb { width: 104px; min-height: 78px; }
  .v2grid { padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
  .v2 .card { flex-direction: column; }
  .v2 .thumb { width: 100%; height: 132px; border-right: none; border-bottom: 1px solid var(--b1); }
  .v3list { padding: 6px 0; }
  .v3 .card { border-radius: 0; border-left: none; border-right: none; border-bottom: none; padding: 0; }
  .v3 .card { border-bottom: 1px solid var(--b1); background: transparent; }
  .v3 .card.on { background: var(--l2); }
  .v3 .card .body { padding: 7px 12px; gap: 2px; flex-direction: row; align-items: center; }
  .v3 .thumb { width: 30px; min-height: 30px; border-radius: 6px; border: 1px solid var(--b1); margin: 6px 0 6px 10px; }
  .v3 .t { flex: 1; white-space: nowrap; }

  /* 右 dock 详情 */
  .preview { border-bottom: 1px solid var(--b1); padding: 12px; }
  .preview .stage { border: 1px solid var(--b1); border-radius: 10px; height: 168px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .field { display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; font-size: 12px; }
  .field b { color: var(--cap); font-weight: 400; }
  .bodybox { background: var(--l2); border: 1px solid var(--b1); border-radius: 8px; padding: 9px 10px; white-space: pre-wrap; word-break: break-all; margin: 10px 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }

  /* 灯箱 */
  .overlay { position: absolute; inset: 0; background: #000000cc; backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .lightbox { width: min(880px, 92%); max-height: 88%; background: var(--bg); border: 1px solid var(--b3); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .lightbox .stage { height: 440px; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, #23262b 0 14px, #1d2024 14px 28px); position: relative; }
  .lightbox .foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--b1); }

  /* 设置弹窗 */
  .modal { width: min(560px, 92%); background: var(--bg); border: 1px solid var(--b3); border-radius: 14px; overflow: hidden; }
  .modal .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--b1); }
  .modal .bd { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .modal .ft { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--b1); }
  .fld { display: flex; align-items: center; gap: 10px; }
  .fld > span { width: 92px; color: var(--cap); font-size: 12px; flex: none; text-align: right; }
  .fld input, .fld select { flex: 1; background: var(--l1); border: 1px solid var(--b1); border-radius: 8px; padding: 6px 9px; }
  .tabs { display: flex; gap: 6px; }
  .note { color: var(--cap); font-size: 11px; }
  .status { color: var(--ok); font-size: 12px; }

  #switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 999px; background: #000c; border: 1px solid #ffffff40; box-shadow: 0 8px 24px #000a; font-size: 12px; }
  #switcher button { width: 26px; height: 26px; border-radius: 50%; background: #ffffff1a; display: flex; align-items: center; justify-content: center; }
  #switcher button:hover { background: #ffffff33; }
  #switcher .sub { color: #ffffff99; }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame">
    <div class="banner">
      <b>原型 v2</b><span>已按你的四条意见改：卡片列表 · 点卡片进右 dock · 图片/视频可放大 · 入库设置改弹窗</span>
      <span class="grow"></span>
      <span class="echo" id="echo">点一下试试：每次操作都会在这里留一句回执（没回执 = 点击没到）</span>
      <span id="banner-why">—</span>
      <span class="kbd">← →</span><span>换列表模式</span>
    </div>
    <div class="shell">
      <div class="side">
        <div style="padding:8px 10px; display:flex; flex-direction:column; gap:4px">
          <button class="row-btn"><span data-icon="plus"></span>新建会话</button>
          <button class="row-btn on"><span data-icon="inbox"></span>Inbox</button>
        </div>
        <div class="side-h">工作区</div>
        <div style="padding:0 10px 6px"><input class="search" style="width:100%" placeholder="搜索会话" /></div>
        <div class="scroll">
          <div class="sess"><span>dsh-inbox</span><span class="tiny">3小时</span></div>
          <div class="sess on"><span>用 inbox 工具查询仓库未读</span></div>
          <div class="sess"><span>s3 拉取 401 排查</span><span class="tiny">17小时</span></div>
          <div class="sess"><span>M6c 文档收尾</span><span class="tiny">1天</span></div>
        </div>
        <div class="side-foot"><span data-icon="settings-2"></span> 设置</div>
      </div>
      <div class="main" id="main"></div>
      <div class="dock" id="dock"></div>
    </div>
    <div id="overlay"></div>
  </div>
</div>

<div id="switcher">
  <button data-nav="-1"><span data-icon="chevron-left" data-size="15"></span></button>
  <span id="sw-label">V1</span>
  <span class="sub" id="sw-name"></span>
  <button data-nav="1"><span data-icon="chevron-right" data-size="15"></span></button>
</div>

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byId = (id) => RECORDS.find((r) => r.id === id);

const isZoomable = (r) => Boolean(r.shot) || mediaKind(r) === 'video' || mediaKind(r) === 'audio' || r.kind === 'file';

const catCount = (id) => RECORDS.filter((r) => r.category === id).length;

function matches(r) {
  if (state.filter === 'unread' && r.status !== 'unread') return false;
  if (state.cat && r.category !== state.cat) return false;
  if (state.q) {
    const hay = [r.title, r.text, r.url, r.note, plat(r)?.name, ...(r.tags || [])].join(' ').toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
const visible = () => RECORDS.filter(matches);

/** 卡片标题：按类型给不同的默认文案。 */
function heading(r) {
  if (r.title) return esc(r.title);
  if (r.category === 'secret') return '密钥 / 账密';
  if (r.kind === 'image') return r.att ? esc(r.att.split(' · ')[0]) : '图片';
  if (r.text) return esc(r.text.split('\n')[0].slice(0, 46));
  return '<span class="muted">（无标题）</span>';
}

/** 卡片正文：这是"不同类别内容不同"的地方。 */
function cardBody(r) {
  const p = plat(r);
  if (r.category === 'secret') {
    return `<span class="masked tiny">•••••••••••••••• ••••••••</span>
      <span class="meta">${icon('lock', 12)} 列表里不显示明文 · 对话里永不输出</span>`;
  }
  if (r.kind === 'image') {
    return `<span class="sub">${esc(r.att ?? '1 个附件')}</span>
      <span class="meta">${icon('zoom-in', 12)} 点开可放大${(r.tags || []).includes('疑似证件') ? ` · <span style="color:var(--warn)">${icon('shield-alert', 12)} 疑似证件</span>` : ''}</span>`;
  }
  if (r.kind === 'file') {
    return `<span class="sub">${esc(r.att ?? '附件')}</span>
      <span class="meta">${icon('paperclip', 12)} 文件 · 点开可预览/放大</span>`;
  }
  if (p && (p.kind === 'video' || p.kind === 'audio')) {
    return `<span class="sub">${esc(p.name)} · ${esc(p.domain)}${r.duration ? ` · ${esc(r.duration)}` : ''}</span>
      <span class="meta">${icon(p.kind === 'video' ? 'film' : 'music', 12)} ${p.kind === 'video' ? '视频' : '音频'} · ${icon('zoom-in', 12)} 可放大预览</span>`;
  }
  if (r.kind === 'link') {
    return `<span class="sub">${esc(r.url)}</span>
      <span class="meta">${icon('link-2', 12)} ${p ? esc(p.name) : '链接'}${r.note ? ` · ${esc(r.note)}` : ''}</span>`;
  }
  return `<span class="sub">${esc((r.text ?? '').slice(0, 88))}</span>`;
}

/** 卡片左边的缩略图/图章：同一外框，内容按类型。 */
function cardThumb(r) {
  const p = plat(r);
  if (r.shot) return `<span class="thumb shot" style="position:relative">${icon('image', 18)}${state.lightbox ? '' : ''}</span>`;
  if (p && p.kind === 'video') return `<span class="thumb poster" style="position:relative">${icon('film', 18)}<span class="play"><i>${icon('play', 12)}</i></span></span>`;
  if (p && p.kind === 'audio') return `<span class="thumb poster" style="position:relative">${icon('music', 18)}<span class="play"><i>${icon('play', 12)}</i></span></span>`;
  if (r.category === 'secret') return `<span class="thumb" style="background:var(--l3)">${icon('key-round', 18)}</span>`;
  if (r.kind === 'file') return `<span class="thumb" style="background:var(--l3)">${icon('file-text', 18)}</span>`;
  if (r.kind === 'link') return `<span class="thumb" style="background:var(--l3)">${icon('link-2', 18)}</span>`;
  return `<span class="thumb" style="background:var(--l3)">${icon(KIND_ICON[r.kind], 18)}</span>`;
}

function card(r) {
  const [srcLabel, srcIcon] = CATSOURCE[r.catSource] ?? CATSOURCE.rule;
  return `<div class="card${r.id === state.sel ? ' on' : ''}" data-act="select" data-id="${r.id}">
    ${cardThumb(r)}
    <div class="body">
      <span class="t">${heading(r)}</span>
      ${cardBody(r)}
      <span class="meta">
        <span class="kind">${icon(catIcon(r.category), 12)} ${esc(cat(r.category))}</span> ·
        <span class="kind">${icon(srcIcon, 12)} ${esc(srcLabel)}</span> ·
        ${icon('clock', 12)} ${esc(r.at.slice(5, 16))}
        ${(r.tags || []).map((t) => `<span style="color:var(--accent)">#${esc(t)}</span>`).join('')}
        <span class="grow"></span>
        ${r.status === 'unread' ? `<span style="color:var(--accent)">${icon('circle', 9)} 未读</span>` : `<span>${icon('check', 11)} 已读</span>`}
      </span>
    </div>
  </div>`;
}

function previewStage(r, big = false) {
  const p = plat(r);
  const h = big ? 440 : 168;
  if (r.shot) return `<div class="stage shot" style="height:${h}px">${icon('image', big ? 48 : 28)}</div>`;
  if (p && (p.kind === 'video' || p.kind === 'audio')) {
    return `<div class="stage poster" style="height:${h}px">${icon(p.kind === 'video' ? 'film' : 'music', big ? 46 : 26)}<span class="play"><i style="${big ? 'width:56px;height:56px' : ''}">${icon('play', big ? 22 : 12)}</i></span></div>`;
  }
  if (r.kind === 'file') return `<div class="stage" style="height:${h}px">${icon('file-text', big ? 46 : 28)}</div>`;
  return '';
}

function mainHTML() {
  const list = visible();
  const page = Math.min(state.page, pages(list.length));
  const slice = list.slice((page - 1) * PER_PAGE, (page - 1) * PER_PAGE + PER_PAGE);
  const rail = [['all', '全部', 'inbox', RECORDS.length], ['unread', '未读', 'circle', unread()], ['bin', '回收站', 'trash-2', 1]]
    .map(([k, label, ic, n]) => `<button class="item${state.filter === k ? ' on' : ''}" data-act="filter" data-v="${k}">${icon(ic, 14)} ${label}<span class="n">${String(n)}</span></button>`).join('')
    + '<div class="rail-h">类目</div>'
    + CATS.map(([id, label, ic]) => `<button class="item${state.cat === id ? ' on' : ''}" data-act="cat" data-v="${id}">${icon(ic, 14)} ${label}<span class="n">${String(catCount(id))}</span></button>`).join('');

  const cards = slice.length === 0
    ? '<div class="empty">这个筛选下没有记录。</div>'
    : slice.map(card).join('');

  return `<div class="bar">
      <span class="title">${icon('inbox', 15)} 仓库</span>
      <span class="tiny muted">${String(list.length)} 条 · 未读 ${String(unread())}</span>
      <span class="grow"></span>
      <span class="seg" role="group" aria-label="列表模式">
        ${MODES.map(([v, label, ic]) => `<button type="button" class="${VARIANT === v ? 'on' : ''}" data-act="mode" data-v="${v}" title="列表模式：${label}">${icon(ic, 14)} ${label}</button>`).join('')}
      </span>
      <input class="search" id="q" placeholder="搜标题 / 正文 / 链接 / 标签" value="${esc(state.q)}" style="max-width:260px" />
      <button type="button" class="btn" data-act="open-settings">${icon('sliders-horizontal', 14)} 入库设置</button>
      ${state.dock ? '' : `<button type="button" class="btn ghost icon" data-act="open-dock" title="打开右栏">${icon('panel-right', 15)}</button>`}
    </div>
    <div class="shell" style="flex:1;min-height:0">
      <div class="rail">${rail}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column">
        <div class="row" style="padding:8px 12px;gap:6px;border-bottom:1px solid var(--b1)">
          <button class="chip${state.filter === 'all' && !state.cat ? ' on' : ''}" data-act="filter" data-v="all">${icon('inbox', 13)} 全部</button>
          <button class="chip${state.filter === 'unread' ? ' on' : ''}" data-act="filter" data-v="unread">${icon('circle', 11)} 只看未读</button>
          ${state.cat ? `<span class="chip on">${icon(catIcon(state.cat), 13)} ${esc(cat(state.cat))} <button data-act="cat" data-v="${state.cat}" style="opacity:.7">${icon('x', 12)}</button></span>` : ''}
          <span class="grow"></span>
          ${state.notice ? `<span class="status">${icon('check-check', 13)} ${esc(state.notice)}</span>` : ''}
          <span class="tiny muted">${String(PER_PAGE)} 条/页</span>
        </div>
        <div class="scroll">
          <div class="${VARIANT === 'V2' ? 'v2grid v2' : VARIANT === 'V3' ? 'v3list v3' : 'v1list v1'}">${cards}</div>
        </div>
        <div class="pager">
          <span>第 ${String(page)} / ${String(pages(list.length))} 页 · 匹配 ${String(list.length)} 条</span>
          <span class="grow"></span>
          <button class="btn sm" data-act="page" data-v="${String(page - 1)}" ${page <= 1 ? 'disabled style="opacity:.4"' : ''}>${icon('chevron-left', 13)} 上一页</button>
          <button class="btn sm" data-act="page" data-v="${String(page + 1)}" ${page >= pages(list.length) ? 'disabled style="opacity:.4"' : ''}>下一页 ${icon('chevron-right', 13)}</button>
        </div>
      </div>
    </div>`;
}

/* ============================ 灯箱 / 设置弹窗 ============================ */
function lightboxHTML() {
  const r = byId(state.lightbox);
  if (!r) return '';
  const p = plat(r);
  const stage = previewStage(r, true);
  const siblings = RECORDS.filter((x) => x.kind === 'image' || mediaKind(x) === 'video' || mediaKind(x) === 'audio' || x.kind === 'file');
  const i = siblings.findIndex((x) => x.id === r.id);
  return `<div class="overlay" data-act="close-lightbox">
    <div class="lightbox" data-stop="1">
      <div class="row" style="padding:10px 12px;border-bottom:1px solid var(--b1)">
        <span>${icon(p?.kind === 'audio' ? 'music' : p?.kind === 'video' ? 'film' : r.shot ? 'image' : 'file-text', 14)} ${esc(r.title || heading(r))}</span>
        <span class="grow"></span>
        <button class="btn ghost icon" data-act="close-lightbox">${icon('x', 15)}</button>
      </div>
      ${stage}
      <div class="foot">
        <span class="tiny muted">${esc(r.att ?? r.url ?? '')}</span>
        <span class="grow"></span>
        <span class="tiny muted">${String(i + 1)} / ${String(siblings.length)}</span>
        <button class="btn sm" data-act="lb-prev">${icon('chevron-left', 13)} 上一张</button>
        <button class="btn sm" data-act="lb-next">下一张 ${icon('chevron-right', 13)}</button>
        ${r.url ? `<button class="btn sm" data-act="open-link" data-id="${r.id}">${icon('external-link', 12)} 在浏览器打开</button>` : ''}
      </div>
    </div>
  </div>`;
}

function settingsHTML() {
  if (state.modal !== 'settings') return '';
  const row = (label, value, type = 'text', ph = '') =>
    `<label class="fld"><span>${label}</span><input type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" /></label>`;
  return `<div class="overlay" data-act="close-modal">
    <div class="modal" data-stop="1">
      <div class="hd">
        <span>${icon('sliders-horizontal', 15)} 入库设置</span>
        <span class="tiny muted">设置服务在 · WebDAV 密码已存 · S3 密钥已存</span>
        <span class="grow"></span>
        <button class="btn ghost icon" data-act="close-modal">${icon('x', 15)}</button>
      </div>
      <div class="bd">
        <div class="fld"><span>协议</span>
          <div class="tabs">
            <button class="chip${state.protocol === 'webdav' ? ' on' : ''}" data-act="protocol" data-v="webdav">${icon('cloud', 13)} WebDAV</button>
            <button class="chip${state.protocol === 's3' ? ' on' : ''}" data-act="protocol" data-v="s3">${icon('layers', 13)} S3</button>
          </div>
          <span class="note">换协议后记得点保存</span>
        </div>
        ${row('客户端标识', state.protocol === 's3' ? 'Obsidian' : 'Zotero', 'text', '留空即 dsh-inbox；有些网关按它认人')}
        ${state.protocol === 's3'
          ? `${row('接入点', 's3.cstcloud.cn', 'text', '不写协议默认 https')}
             ${row('Bucket', 'duoyu-inbox')}
             <div class="fld"><span>签名</span>
               <select><option>v4</option><option>v2</option></select>
               <input value="us-east-1" style="flex:0 1 130px" />
             </div>
             ${row('AccessKey ID', 'AKIAXWOIMIATPKRL5MXQ')}
             ${row('Secret', '', 'password', '已存（留空则不改）')}
             <div class="note">目录一栏同时是 S3 的 key 前缀（默认 /inbox）。</div>`
          : `${row('地址', 'https://data.cstcloud.cn/dav')}
             ${row('目录', '/')}
             ${row('用户名', 'chance722')}
             ${row('密码', '', 'password', '已存（留空则不改）')}`}
        <div class="note">${icon('lock', 12)} 密码与密钥进 dsh 的凭证库，不写进配置；客户端标识按协议各存一份。</div>
      </div>
      <div class="ft">
        <button class="btn primary" data-act="save-settings">${icon('check', 13)} 保存</button>
        <button class="btn" data-act="pull">${icon('refresh-cw', 13)} 立即拉取</button>
        <button class="btn" data-act="selftest">${icon('search', 13)} 自检</button>
        <span class="grow"></span>
        <span class="tiny muted" id="modal-msg">${esc(state.notice)}</span>
      </div>
    </div>
  </div>`;
}

/* ============================ 绘制 ============================ */
function draw() {
  document.getElementById('main').innerHTML = mainHTML();
  const dock = document.getElementById('dock');
  dock.className = 'dock' + (state.dock ? '' : ' closed');
  dock.innerHTML = dockHTML();
  document.getElementById('overlay').innerHTML = lightboxHTML() + settingsHTML();
  document.getElementById('sw-label').textContent = VARIANT;
  document.getElementById('sw-name').textContent = VNAME[VARIANT];
  document.getElementById('banner-why').textContent = VWHY[VARIANT];
  const echo = document.getElementById('echo');
  echo.textContent = state.echo || '点一下试试：每次操作都会在这里留一句回执（没回执 = 点击没到）';
  echo.className = 'echo' + (state.echoBad ? ' bad' : '');
}

function setVariant(next) {
  VARIANT = next;
  state.page = 1;
  state.echo = `列表模式 → ${VNAME[next]}`;
  state.echoBad = false;
  try { history.replaceState(null, '', '?variant=' + VARIANT); } catch { /* file:// 不让改地址，无所谓 */ }
  draw();
}
function toast(msg) { state.notice = msg; state.echo = msg; state.echoBad = false; draw(); setTimeout(() => { state.notice = ''; draw(); }, 2600); }

/* ============================ 交互 ============================ */
document.addEventListener('click', (event) => {
  try {
  const nav = event.target.closest('[data-nav]');
  if (nav) { setVariant(VARIANTS[(VARIANTS.indexOf(VARIANT) + Number(nav.dataset.nav) + 3) % 3]); return; }
  const el = event.target.closest('[data-act]');
  if (!el) return;
  // 点遮罩关灯箱/弹窗，但点内容不关
  if ((el.dataset.act === 'close-lightbox' || el.dataset.act === 'close-modal') && event.target.closest('[data-stop]') && !event.target.closest('button')) return;
  const rec = el.dataset.id ? byId(el.dataset.id) : undefined;
  switch (el.dataset.act) {
    case 'mode': VARIANT = VARIANTS.includes(el.dataset.v) ? el.dataset.v : VARIANT; state.page = 1; state.echo = `列表模式 → ${VNAME[VARIANT]}`; break;
    case 'select': state.sel = el.dataset.id; state.secret = false; state.dock = true; state.echo = `选中 ${el.dataset.id}，详情已开到右栏`; break;
    case 'filter': state.filter = el.dataset.v; state.page = 1; state.echo = `筛选 → ${el.dataset.v}`; break;
    case 'cat': state.cat = state.cat === el.dataset.v ? null : el.dataset.v; state.page = 1; state.echo = state.cat ? `类目 → ${cat(state.cat)}` : '类目 → 全部'; break;
    case 'page': state.page = Math.max(1, Number(el.dataset.v)); state.echo = `翻到第 ${String(state.page)} 页`; break;
    case 'toggle-read': if (rec) rec.status = rec.status === 'unread' ? 'read' : 'unread'; state.echo = '改了已读状态'; break;
    case 'toggle-secret': state.secret = !state.secret; state.echo = state.secret ? '显示明文（只在本机）' : '遮住明文'; break;
    case 'lightbox': state.lightbox = el.dataset.id; state.echo = '打开放大视图'; break;
    case 'close-lightbox': state.lightbox = null; state.echo = '关掉放大视图'; break;
    case 'lb-prev': case 'lb-next': {
      const sibs = RECORDS.filter((x) => isZoomable(x));
      const i = sibs.findIndex((x) => x.id === state.lightbox);
      const j = (i + (el.dataset.act === 'lb-next' ? 1 : sibs.length - 1)) % sibs.length;
      state.lightbox = sibs[j].id; state.sel = sibs[j].id;
      state.echo = '放大视图：上一张 / 下一张';
      break;
    }
    case 'delete': if (rec) { RECORDS = RECORDS.filter((x) => x.id !== rec.id); state.sel = RECORDS[0]?.id ?? ''; toast('已移入回收站（软删）'); } break;
    case 'open-dock': state.dock = true; state.echo = '打开右侧栏'; break;
    case 'close-dock': state.dock = false; state.echo = '收起右侧栏'; break;
    case 'open-settings': state.modal = 'settings'; state.echo = '已打开「入库设置」弹窗'; break;
    case 'close-modal': state.modal = null; state.echo = '关掉设置弹窗'; break;
    case 'protocol': state.protocol = el.dataset.v; state.echo = `协议 → ${el.dataset.v}`; break;
    case 'save-settings': toast('设置已保存（原型不真存）'); break;
    case 'pull': toast('拉取完成：远端列出 1 项，新入库 0 条，跳过 1 条'); break;
    case 'selftest': toast('自检：8 行里 6 行 200（原型假数据）'); break;
    case 'open-link': toast('真实实现里：新标签页打开 ' + (rec?.url ?? '')); break;
    case 'toast': toast(el.dataset.msg ?? '原型占位'); break;
    default: break;
  }
  draw();
  } catch (error) {
    // 点下去"没反应"是最难查的故障：把异常直接写在横幅上，别让它沉底。
    state.echo = '点击处理出错：' + (error && error.message ? error.message : String(error));
    state.echoBad = true;
    draw();
  }
});

document.addEventListener('change', (event) => {
  const el = event.target.closest('[data-act="set-cat"]');
  if (!el) return;
  const rec = byId(el.dataset.id);
  if (rec) { rec.category = el.value; rec.catSource = 'user'; draw(); }
});

document.addEventListener('input', (event) => {
  if (event.target.id !== 'q') return;
  state.q = event.target.value;
  state.page = 1;
  const pos = event.target.selectionStart;
  draw();
  const q = document.getElementById('q');
  if (q) { q.focus(); q.setSelectionRange(pos, pos); }
});

document.addEventListener('keydown', (event) => {
  const t = event.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
  if (event.key === 'Escape') { state.lightbox = null; state.modal = null; draw(); return; }
  if (!typing && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
    setVariant(VARIANTS[(VARIANTS.indexOf(VARIANT) + (event.key === 'ArrowRight' ? 1 : 2)) % 3]);
    return;
  }
  if (typing) return;
  const list = visible();
  const i = list.findIndex((r) => r.id === state.sel);
  if (event.key === 'j' || event.key === 'k') {
    const next = Math.min(list.length - 1, Math.max(0, i + (event.key === 'j' ? 1 : -1)));
    if (list[next]) { state.sel = list[next].id; state.dock = true; draw(); }
  } else if (event.key === 'Enter' && list[i]) {
    list[i].status = list[i].status === 'unread' ? 'read' : 'unread'; draw();
  } else if (event.key === 'z' && list[i] && isZoomable(list[i])) { state.lightbox = list[i].id; draw(); }
  else if (event.key === 's') { state.modal = 'settings'; state.echo = '已打开「入库设置」弹窗（快捷键 s）'; draw(); }
  else if (event.key === 'd') { state.dock = !state.dock; draw(); }
  else if (event.key === '/') { const q = document.getElementById('q'); if (q) { q.focus(); event.preventDefault(); } }
});

const initial = new URLSearchParams(location.search).get('variant');
if (initial && VARIANTS.includes(initial.toUpperCase())) VARIANT = initial.toUpperCase();
document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon, Number(el.dataset.size ?? 15)); });
draw();
</script>
</body>
</html>
